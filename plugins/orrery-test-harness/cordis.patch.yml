# Integration-test composition for the `orrery-it` headless profile:
# a scripted mock LLM adapter (provider `mock`) plus the orrery modules
# mounted at host level (this profile has no agent-preset registry; the
# orrery-harness bundle itself is NOT loaded here — it only supplies module
# resolution through the profile's node_modules).
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: mock
    model: mock-1
# Mirror the desktop host's sandbox semantics (S23): pin the DEPLOYMENT
# fallback workspace root AWAY from the session workspace, so any ctx.fs
# writer that omits the per-call policy is denied exactly like desktop
# sessions. The test workspace lives outside /tmp and tmpdir(), so the
# unconditional writable roots cannot rescue a faulty call either.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js (process.env.ORRERY_IT_ROOT ?? '/Users/young/.orrery-it') + '/outside'
- insert:
    - id: orrery-it-mock-llm
      name: 'orrery-test-harness/mock-llm'
    # Mirror the profile-level settings row: exercises the orrerySettings
    # service path headlessly (it supplies the classifier route — the semantic
    # scenario only passes when the overlay actually delivers these values).
    - id: orrery-it-settings
      name: 'orrery-harness/settings'
      config:
        intentGateProvider: mock
        intentGateModel: mock-1
    - id: orrery-it-event-tap
      name: 'orrery-test-harness/event-tap'
    - id: orrery-it-core
      name: 'orrery-harness/core'
    - id: orrery-it-intent-gate
      name: 'orrery-harness/intent-gate'
      config:
        # Exercise the semantic classifier headlessly; the sidecar route comes
        # from the settings row above (orrerySettings overlay proof).
        classifier: 'llm'
    - id: orrery-it-delegate
      name: 'orrery-harness/delegate'
      config:
        # Keep the supervision backoff fast enough for a headless run.
        supervision:
          initialBackoffMs: 50
          maxBackoffMs: 100
        # Per-scenario registry-level disable: empty unless a scenario sets
        # ORRERY_IT_DISABLED_CATEGORY (comma-separated), so the shared baseline
        # keeps every category enabled. The `targets` scenario uses it to prove
        # that a disabled target is neither advertised nor spawnable.
        categories: !!js 'Object.fromEntries((process.env.ORRERY_IT_DISABLED_CATEGORY ?? "").split(",").filter(Boolean).map((name) => [name, { disabled: true }]))'
    - id: orrery-it-todo-driver
      name: 'orrery-harness/todo-driver'
    # Edit Lock row in preset order (before hashline-edit). Enabled only for
    # the editlock scenario so every other scenario keeps today's behavior.
    - id: orrery-it-edit-lock
      name: 'orrery-harness/edit-lock'
      config:
        enabled: !!js process.env.ORRERY_IT_EDIT_LOCK === '1'
    - id: orrery-it-hashline-edit
      name: 'orrery-harness/hashline-edit'
      config:
        # Mirror the real preset's default: hash_edit is the only edit tool.
        hideStockEdit: true
    # LSP module under test: registry points the typescript server at the
    # scripted mock LSP server (protocol fixture, no external installs), with
    # the capability gate ON (mirrors the settings row flipped on).
    - id: orrery-it-lsp
      name: 'orrery-harness/lsp'
      config:
        enabled: true
        servers:
          typescript:
            # process.execPath = the interpreter that booted this profile, so the
            # mock server launches on any platform without a hardcoded path.
            command: !!js process.execPath
            args: [!!js (process.env.ORRERY_IT_ROOT ?? '/Users/young/.orrery-it') + '/ws/mock-lsp-server.js']
            installHint: 'not-needed-in-tests'
    # Mirror the real preset's realm structure: the compaction provider and the
    # context-guard consumer co-isolated in one group. This reproduces the
    # "waiting for compaction" preset-load failure class headlessly.
    - id: orrery-it-compaction
      name: cordis:group
      group: true
      isolate:
        compaction: true
        toolResultPruner: true
      config:
        - id: orrery-it-compaction-basic
          name: '@deepseek-ai/dsh-compaction-basic'
        - id: orrery-it-context-guard
          name: 'orrery-harness/context-guard'
