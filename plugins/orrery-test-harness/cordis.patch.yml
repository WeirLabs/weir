# Integration-test composition for the `orrery-it` headless profile:
# a scripted mock LLM adapter (provider `mock`) plus the orrery modules
# mounted at host level. Skill composition scenarios additionally create a real
# preset; the product bundle supplies resolution, not profile activation.
# Mirror the product's OFF composition; HOST is an explicit negative control.
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: mock
    model: mock-1
# Mirror the desktop host's sandbox semantics (S23): pin the DEPLOYMENT
# fallback workspace root AWAY from the session workspace, so any ctx.fs
# writer that omits the per-call policy is denied exactly like desktop
# sessions. The test workspace lives outside /tmp and tmpdir(), so the
# unconditional writable roots cannot rescue a faulty call either.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js (process.env.ORRERY_IT_ROOT ?? '/Users/young/.orrery-it') + '/outside'
- insert:
    - id: orrery-it-mock-llm
      name: 'orrery-test-harness/mock-llm'
    - id: orrery-skill-selection
      name: 'orrery-test-harness/skill-selection'
      disabled: !!js "Boolean(process.env.ORRERY_IT_SKILL_COMPOSITION)"
    - id: orrery-it-tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
      disabled: !!js "Boolean(process.env.ORRERY_IT_SKILL_COMPOSITION)"
    - id: orrery-it-agent-presets
      name: '@deepseek-ai/dsh-agent-preset-registry'
      disabled: !!js "!process.env.ORRERY_IT_SKILL_COMPOSITION"
      config:
        default: orrery-it-selection
    - id: orrery-it-skill-composition-probe
      name: 'orrery-test-harness/skill-composition-probe'
    - id: orrery-it-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "process.env.ORRERY_IT_SKILL_COMPOSITION !== 'OFFICE'"
      config:
        node: !!js process.env.ORRERY_IT_NODE
        cli: !!js process.env.ORRERY_IT_OFFICE_CLI
    # Mirror the profile-level settings row: exercises the orrerySettings
    # service path headlessly (it supplies the classifier route — the semantic
    # scenario only passes when the overlay actually delivers these values).
    - id: orrery-it-settings
      name: 'orrery-harness/settings'
      config:
        intentGateProvider: mock
        intentGateModel: mock-1
        # Message-driven auto-resume counter-case: the live gate is switched off
        # only when the scenario asks for it (default stays ON everywhere else).
        editLockAutoResume: !!js "process.env.ORRERY_IT_AUTO_RESUME === 'off' ? false : undefined"
    - id: orrery-it-event-tap
      name: 'orrery-test-harness/event-tap'
    # Capability-store probe, host level: the baseline the isolated row below
    # is compared against (capstore scenario only).
    - id: orrery-it-capstore-probe-host
      name: 'orrery-test-harness/capstore-probe'
      config:
        label: host
        enabled: !!js process.env.ORRERY_IT_CAPSTORE === '1'
    - id: orrery-it-core
      name: 'orrery-harness/core'
    - id: orrery-it-intent-gate
      name: 'orrery-harness/intent-gate'
      config:
        # Exercise the semantic classifier headlessly; the sidecar route comes
        # from the settings row above (orrerySettings overlay proof).
        classifier: 'llm'
    # Worktree lanes: host state machine + lane tools + /worktree command.
    # Provider (worktree) and consumer (delegate) sit at the same host level
    # here, mirroring the preset where both share the delegation group.
    - id: orrery-it-worktree
      name: 'orrery-harness/worktree'
    - id: orrery-it-delegate
      name: 'orrery-harness/delegate'
      config:
        # Keep the supervision backoff fast enough for a headless run.
        supervision:
          initialBackoffMs: 50
          maxBackoffMs: 100
        # Per-scenario registry-level disable: empty unless a scenario sets
        # ORRERY_IT_DISABLED_CATEGORY (comma-separated), so the shared baseline
        # keeps every category enabled. The `targets` scenario uses it to prove
        # that a disabled target is neither advertised nor spawnable.
        categories: !!js 'Object.fromEntries((process.env.ORRERY_IT_DISABLED_CATEGORY ?? "").split(",").filter(Boolean).map((name) => [name, { disabled: true }]))'
    # Mirror the preset realm structure for the Edit Lock service: provider
    # (edit-lock) and consumers (todo-driver, hashline-edit, lsp) share one
    # isolated realm, exactly like the preset's delegation group. A consumer
    # outside the realm would not see the service and its edits would be
    # denied by the guard, so the editlock scenario fails on a realm mistake.
    - id: orrery-it-editing
      name: cordis:group
      group: true
      isolate:
        orreryEditLock: true
      config:
        - id: orrery-it-todo-driver
          name: 'orrery-harness/todo-driver'
        # Capability-store probe inside an isolated realm: proves the host
        # profileContext reaches Orrery rows mounted under a cordis:group.
        - id: orrery-it-capstore-probe-realm
          name: 'orrery-test-harness/capstore-probe'
          config:
            label: realm
            enabled: !!js process.env.ORRERY_IT_CAPSTORE === '1'
        # Edit Lock row in preset order (before hashline-edit). Enabled only for
        # the editlock scenario so every other scenario keeps today's behavior.
        - id: orrery-it-edit-lock
          name: 'orrery-harness/edit-lock'
          config:
            enabled: !!js process.env.ORRERY_IT_EDIT_LOCK === '1'
            # A fixed authority is pinned for the stop-boundary family and for
            # the auto-resume family (a second boot must reopen the same one).
            root: !!js "(process.env.ORRERY_IT_STOP_BOUNDARY || process.env.ORRERY_IT_AUTO_RESUME) ? process.env.ORRERY_IT_ROOT + '/ws' : undefined"
            authorityDirectory: !!js "process.env.ORRERY_IT_STOP_BOUNDARY ? process.env.ORRERY_IT_ROOT + '/ws/.orrery/edit-lock-' + process.env.ORRERY_IT_STOP_BOUNDARY : (process.env.ORRERY_IT_AUTO_RESUME ? process.env.ORRERY_IT_ROOT + '/ws/.orrery/edit-lock-auto-resume' + (process.env.ORRERY_IT_AUTO_RESUME === 'off' ? '-off' : '') : undefined)"
        - id: orrery-it-hashline-edit
          name: 'orrery-harness/hashline-edit'
          config:
            # Mirror the real preset's default: hash_edit is the only edit tool.
            hideStockEdit: true
        # LSP module under test: registry points the typescript server at the
        # scripted mock LSP server (protocol fixture, no external installs), with
        # the capability gate ON (mirrors the settings row flipped on).
        - id: orrery-it-lsp
          name: 'orrery-harness/lsp'
          config:
            enabled: true
            servers:
              typescript:
                # process.execPath = the interpreter that booted this profile, so the
                # mock server launches on any platform without a hardcoded path.
                command: !!js process.execPath
                args: [!!js (process.env.ORRERY_IT_ROOT ?? '/Users/young/.orrery-it') + '/ws/mock-lsp-server.js']
                installHint: 'not-needed-in-tests'
    # Mirror the real preset's realm structure: the compaction provider and the
    # context-guard consumer co-isolated in one group. This reproduces the
    # "waiting for compaction" preset-load failure class headlessly.
    - id: orrery-it-compaction
      name: cordis:group
      group: true
      isolate:
        compaction: true
        toolResultPruner: true
      config:
        - id: orrery-it-compaction-basic
          name: '@deepseek-ai/dsh-compaction-basic'
        - id: orrery-it-context-guard
          name: 'orrery-harness/context-guard'
