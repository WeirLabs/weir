<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weir — Orchestrator preset for DeepSeek Harness">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(236,236,230,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- void + grid -->
  <rect width="1200" height="480" fill="#0a0a0b"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" fill="none" stroke="rgba(236,236,230,0.16)"/>

  <!-- HUD chrome -->
  <g font-family="'SF Mono',Menlo,monospace" font-size="12" letter-spacing="2">
    <text x="28" y="36" fill="#ecece6">WEIR / AI AGENT HARNESS</text>
    <text x="1172" y="36" fill="rgba(236,236,230,0.5)" text-anchor="end">R01 · 2026</text>
    <text x="28" y="452" fill="rgba(236,236,230,0.5)">SN-0001-ACID · BUILD 2026 · <tspan fill="#ccff00">● VERIFIED</tspan></text>
    <text x="1172" y="452" fill="rgba(236,236,230,0.5)" text-anchor="end">FLUID.SIM / LIVE</text>
  </g>

  <!-- acid crest line (weir water level) -->
  <rect x="28" y="238" width="1144" height="1.5" fill="#ccff00"/>
  <rect x="356" y="233" width="11" height="11" fill="#ccff00"/>
  <text x="380" y="228" font-family="'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#ccff00">CREST · 堰口水位线</text>

  <!-- pink survey mark -->
  <g stroke="#ff2e9a" stroke-width="1.2" fill="none">
    <circle cx="640" cy="238" r="14" stroke-dasharray="3 2.4"/>
    <line x1="640" y1="216" x2="640" y2="260"/>
    <line x1="618" y1="238" x2="662" y2="238"/>
  </g>

  <!-- Weir symbol -->
  <g transform="translate(96 108) scale(1.9)">
    <polygon points="16,48 30,48 56,126 80,56 104,126 130,48 144,48 144,144 16,144" fill="#ecece6"/>
    <rect x="16" y="24" width="128" height="10" fill="#ccff00"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(500 96) scale(1.05)">
    <g fill="#ecece6">
      <polygon points="0,0 24,0 38,53.8 52,0 76,0 90,53.8 104,0 128,0 102,100 78,100 64,46.2 50,100 26,100"/>
      <rect x="146" y="0" width="23" height="100"/><rect x="146" y="0" width="66" height="20"/><rect x="146" y="40" width="58" height="20"/><rect x="146" y="80" width="66" height="20"/>
      <rect x="230" y="0" width="23" height="100"/>
      <rect x="271" y="0" width="23" height="100"/><rect x="271" y="0" width="40" height="20"/><rect x="271" y="44" width="40" height="20"/>
      <path d="M311 0A32 32 0 0 1 311 64V44A12 12 0 0 0 311 20Z"/>
      <polygon points="303,58 327,58 347,100 323,100"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="502" y="296" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="24" fill="#ecece6" letter-spacing="1">让 AI 助手像总指挥一样为你工作</text>
  <text x="502" y="332" font-family="'SF Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="rgba(236,236,230,0.55)">ORCHESTRATE · DELEGATE · VERIFY · COMPLETE</text>

  <!-- bottom fade -->
  <rect x="0" y="400" width="1200" height="80" fill="url(#fade)"/>
</svg>
