name: edit-lock-dual-gui

# Manual-dispatch dual-GUI Edit Lock acceptance: two independent dsh web
# processes (separate DSH_HOME/profile/port/browser) over one disposable
# workspace, driven through real headless-Chrome CDP controls by
# plugins/weir-test-harness/src/dual-gui-qa.mjs. Not part of the PR gate — the
# matrix boots real browsers and is meant for pre-release verification.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      matrix:
        description: Acceptance matrix depth
        type: choice
        default: core
        options:
          - core
          - heavy
  # PR trigger: GitHub only registers workflow_dispatch workflows from the
  # default branch, so pre-release acceptance runs as a draft PR check with an
  # explicit three-OS matrix. Heavy acceptance is the default there because the
  # matrix exists to block the stable label, not to gate every PR.
  pull_request:

permissions:
  contents: read

jobs:
  dual-gui:
    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"os":["ubuntu-latest","windows-latest","macos-latest"],"matrix":["heavy"]}') || fromJSON('{"os":[inputs.os],"matrix":[inputs.matrix]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml pins autoInstallPeers: false, so the declared
      # @deepseek-ai/dsh peer is never fetched into this workspace.
      - run: pnpm install --frozen-lockfile

      # The driver self-checks: no GUI boot, no network, no stray processes.
      # Scoped to the driver's OWN suite: the full weir-test-harness suite
      # carries replay-oracle fixtures with committed absolute macOS paths
      # (assert-replay: rehydrate/capstore/editlock-recovery-ux) and POSIX-only
      # temp-path assumptions (git-repo) whose portability is a separate fix;
      # on windows-latest they failed BEFORE this workflow's subject (the
      # driver + matrix) ever ran — run 38104930194. No other workflow runs
      # the harness suite on CI, so nothing is silently un-gated here.
      - run: node --test plugins/weir-test-harness/test/dual-gui-qa.test.js

      # The CLI under test comes from the public registry: the same
      # @deepseek-ai/dsh@0.2.0-rc.2 the desktop app ships. The driver spawns
      # `node lib/bin.js` directly — .cmd shims cannot be spawned without a
      # shell on Windows.
      - name: install dsh CLI
        run: npm install --prefix "${{ runner.temp }}/dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2

      - name: dual-GUI acceptance matrix
        env:
          DUAL_GUI_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
          DUAL_GUI_ROOT: ${{ runner.temp }}/dual-gui-qa
          DUAL_GUI_MATRIX: ${{ matrix.matrix }}
          # Cold profile creation + first boot can exceed the dev-machine
          # budget on a shared runner.
          DUAL_GUI_BOOT_TIMEOUT_MS: '300000'
          DUAL_GUI_PHASE_TIMEOUT_MS: '90000'
        run: node plugins/weir-test-harness/src/dual-gui-qa.mjs run

      # The lock-guarded multi-file rename acceptance must also run on the same
      # runner OS (tasks 3.3/3.4): the installed-runtime scenario drives a real
      # LSP protocol fixture with WEIR_IT_EDIT_LOCK=1. WEIR_IT_DSH names the
      # bin.js entry; run.mjs spawns NODE + that path (never a .cmd shim).
      # run.mjs invokes NODE + PNPM script directly. Resolve the real pnpm.mjs
      # through npm (present with every actions/setup-node install, every OS),
      # never through the action-setup shim layout (which varies).
      - name: resolve pnpm script
        id: pnpm-script
        run: |
          npm install --prefix "${{ runner.temp }}/pnpm-pkg" pnpm@11 >/dev/null 2>&1
          echo "path=${{ runner.temp }}/pnpm-pkg/node_modules/pnpm/bin/pnpm.mjs" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: lock-guarded lsp_rename acceptance
        env:
          WEIR_IT_DSH: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
          WEIR_IT_ROOT: ${{ runner.temp }}/it-lsp-rename
          # run.mjs defaults its toolchain to the desktop bundled runtime paths;
          # on a runner they do not exist, so point at the runner's own node
          # and the pnpm/action-setup shim explicitly.
          WEIR_IT_NODE: node
          WEIR_IT_PNPM: ${{ steps.pnpm-script.outputs.path }}
        run: node plugins/weir-test-harness/run.mjs editlock-lsp-rename
        working-directory: plugins/weir-test-harness

      # Screenshots, sanitized server logs, console events and the PASS
      # matrix report; kept on failure AND success for cross-platform diffs.
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-gui-qa-${{ matrix.os }}-${{ matrix.matrix }}
          path: ${{ runner.temp }}/dual-gui-qa
          if-no-files-found: warn
