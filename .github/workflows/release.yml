name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm Trusted Publishing (OIDC)
  contents: write # publish + GitHub Release notes

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the tag must equal the bundle manifest version, so a stray
      # manual tag can never publish a mismatched package.
      - name: verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./plugins/weir-harness/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match manifest version $PKG" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # prepack (check + unit tests + client build) runs inside npm publish,
      # so the published tarball always carries a freshly built client.
      - run: npm publish --provenance --access public
        working-directory: plugins/weir-harness

      # Release notes = this version's CHANGELOG section, verbatim.
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # index()-based extraction: mawk (ubuntu default) treats \[ in a
          # dynamic regex as a character class, so $0 ~ ver never matches.
          awk -v ver="## [${GITHUB_REF_NAME#v}]" '
            index($0, ver) == 1 { found=1; print; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "no CHANGELOG section found for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
