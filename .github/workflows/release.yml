name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # prepack (check + unit tests + client build) runs inside npm publish,
      # so the published tarball always carries a freshly built client.
      - run: npm publish --provenance --access public
        working-directory: plugins/weir-harness
